name: Build Tellurium

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: msbuild Tellurium.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Tellurium-x64
          path: |
            x64/Release/*.dll
            Tellurium/x64/Release/*.dll

